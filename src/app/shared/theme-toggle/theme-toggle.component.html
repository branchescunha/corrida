<button
  type="button"
  class="theme-toggle"
  (click)="themeService.alternar()"
  [attr.aria-label]="
    themeService.theme() === 'light'
      ? 'Ativar tema escuro'
      : 'Ativar tema claro'
  "
  [title]="
    themeService.theme() === 'light'
      ? 'Ativar tema escuro'
      : 'Ativar tema claro'
  "
>
  @if (themeService.theme() === 'light') {
    <svg
      class="theme-toggle__icon"
      viewBox="0 0 24 24"
      aria-hidden="true"
    >
      <path
        d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7Z"
      />
    </svg>
  } @else {
    <svg
      class="theme-toggle__icon"
      viewBox="0 0 24 24"
      aria-hidden="true"
    >
      <circle
        cx="12"
        cy="12"
        r="4"
      />

      <path d="M12 2v2" />
      <path d="M12 20v2" />
      <path d="m4.93 4.93 1.42 1.42" />
      <path d="m17.65 17.65 1.42 1.42" />
      <path d="M2 12h2" />
      <path d="M20 12h2" />
      <path d="m6.35 17.65-1.42 1.42" />
      <path d="m19.07 4.93-1.42 1.42" />
    </svg>
  }
</button>
